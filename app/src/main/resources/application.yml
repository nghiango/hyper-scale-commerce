spring:
  application:
    name: hyper-scale-commerce
  main:
    banner-mode: "off"
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hyperscale}?targetServerType=primary}
    username: ${POSTGRES_USER:hyperscale}
    password: ${POSTGRES_PASSWORD:hyperscale}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 5000
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      max-poll-records: 500
    listener:
      concurrency: 3
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_secure_password}
      connect-timeout: 1s
      timeout: 1s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 10000
    connection-timeout: 20000
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json

app:
  name: ${APP_NAME:hyper-scale-commerce}
  datasource:
    primary:
      url: ${SPRING_DATASOURCE_PRIMARY_URL:}
      maximum-pool-size: ${PRIMARY_DB_POOL_SIZE:30}
    replica:
      url: ${SPRING_DATASOURCE_REPLICA_URL:}
      maximum-pool-size: ${REPLICA_DB_POOL_SIZE:20}
      max-lag-ms: ${REPLICA_MAX_LAG_MS:100}
      lag-check-interval-ms: ${REPLICA_LAG_CHECK_INTERVAL_MS:1000}
  outbox:
    topic: order-placed
    relay-interval-ms: 100
    claim-limit: 500
  load-shedding:
    enabled: true
    latency-threshold-ms: 200
    max-in-flight-degradable: 500
  storage:
    pruning:
      enabled: true
      outbox-retention-days: 7
      idempotency-retention-hours: 24
      batch-size: 1000
      interval-ms: 3600000
      initial-delay-ms: 60000
  rate-limiting:
    enabled: true
    limit-per-minute: 60000
    retry-after-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
    info:
      enabled: true
