namespace: hyperscale
components:
  prometheus:
    image: prom/prometheus:v3.2.1
    args: ["--config.file=/config/prometheus.yaml", "--storage.tsdb.path=/data", "--storage.tsdb.retention.time=24h"]
    ports: [{name: http, containerPort: 9090}]
    config: prometheus.yaml
    memory: 512Mi
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    args: ["--config=/config/otel.yaml"]
    ports: [{name: zipkin, containerPort: 9411}, {name: otlp, containerPort: 4317}]
    config: otel.yaml
    memory: 256Mi
  tempo:
    image: grafana/tempo:2.7.2
    args: ["-config.file=/config/tempo.yaml"]
    ports: [{name: http, containerPort: 3200}, {name: otlp, containerPort: 4317}]
    config: tempo.yaml
    memory: 512Mi
  grafana:
    image: grafana/grafana:11.6.0
    ports: [{name: http, containerPort: 3000}]
    memory: 256Mi
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    ports: [{name: http, containerPort: 8080}]
    memory: 768Mi
    env:
      - {name: KAFKA_CLUSTERS_0_NAME, value: hyperscale-local}
      - {name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: kafka:9092}
      - {name: KAFKA_CLUSTERS_0_READONLY, value: "true"}
      - {name: DYNAMIC_CONFIG_ENABLED, value: "false"}
