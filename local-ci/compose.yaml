name: hyperscale-local-ci
services:
  jenkins:
    image: jenkins/jenkins:2.580.1-jdk21
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
  agent:
    profiles: [agent]
    build:
      context: ..
      dockerfile: local-ci/jenkins/Agent.Dockerfile
    environment:
      JENKINS_AGENT_SECRET: ${JENKINS_AGENT_SECRET:-}
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - agent-workspace:/workspace
    restart: unless-stopped
    mem_limit: 4g
    cpus: 4
volumes:
  agent-workspace:
  jenkins-home:
