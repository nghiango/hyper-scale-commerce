# Configure repository read credentials and push the first generated release before applying.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hyperscale-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nghiango/hyper-scale-commerce-gitops.git
    targetRevision: main
    path: charts/application
    helm:
      valueFiles: [../../environments/local/application-values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: hyperscale
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: app
      jsonPointers: [/spec/replicas]
    - group: apps
      kind: Deployment
      name: order-query
      jsonPointers: [/spec/replicas]
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hyperscale-local-infrastructure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nghiango/hyper-scale-commerce-gitops.git
    targetRevision: main
    path: charts/infrastructure
    helm:
      valueFiles: [../../environments/local/infrastructure-values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: hyperscale
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hyperscale-local-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nghiango/hyper-scale-commerce-gitops.git
    targetRevision: main
    path: charts/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: hyperscale
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true]
