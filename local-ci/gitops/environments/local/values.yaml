# Generated by Jenkins from a verified application commit. Never put secrets here.
global:
  namespace: hyperscale
  revision: "COMMIT_SHA"
  imagePullPolicy: Always
app:
  replicaCount: 1
  image:
    repository: IMAGE_PREFIX/hyperscale-app
    tag: "COMMIT_SHA"
orderQuery:
  replicaCount: 1
  image:
    repository: IMAGE_PREFIX/hyperscale-order-query
    tag: "COMMIT_SHA"
postgresHa:
  image:
    repository: IMAGE_PREFIX/hyperscale-patroni
    tag: "COMMIT_SHA"
localDelivery:
  enabled: true
  # 2 services * (8 max + 1 surge) * (8 primary + 4 replica) = 216 connections.
  # Reserve additional headroom for migrations, Patroni and operator sessions.
  primaryPoolSize: 8
  replicaPoolSize: 4
  tracingEndpoint: http://otel-collector:9411/api/v2/spans
