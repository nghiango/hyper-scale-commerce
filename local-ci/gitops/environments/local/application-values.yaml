# Generated by Jenkins from a verified application commit. Never put secrets here.
global:
  namespace: hyperscale
  revision: "COMMIT_SHA"
  imagePullPolicy: Always
app:
  replicaCount: 1
  hpa:
    minReplicas: 1
    maxReplicas: 3
    memoryMetricEnabled: false
  image:
    repository: IMAGE_PREFIX/hyperscale-app
    tag: "COMMIT_SHA"
orderQuery:
  replicaCount: 1
  hpa:
    minReplicas: 1
    maxReplicas: 3
    memoryMetricEnabled: false
  image:
    repository: IMAGE_PREFIX/hyperscale-order-query
    tag: "COMMIT_SHA"
localDelivery:
  enabled: true
  # 2 services * (3 max + 1 surge) * (8 primary + 4 replica) = 96 connections.
  # Reserve additional headroom for migrations, Patroni and operator sessions.
  primaryPoolSize: 8
  replicaPoolSize: 4
  tracingEndpoint: http://otel-collector:9411/api/v2/spans
