apiVersion: v1
kind: Namespace
metadata:
  name: local-registry
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: registry-data, namespace: local-registry}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: local-registry}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: local-registry}
  template:
    metadata:
      labels: {app: local-registry}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: registry
          image: registry:2.8.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{containerPort: 5000}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          readinessProbe:
            httpGet: {path: /v2/, port: 5000}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: registry-data}
---
apiVersion: v1
kind: Service
metadata: {name: registry, namespace: local-registry}
spec:
  type: NodePort
  selector: {app: local-registry}
  ports: [{port: 5000, targetPort: 5000, nodePort: 30500}]
