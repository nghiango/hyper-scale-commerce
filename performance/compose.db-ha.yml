services:
  # -------------------------------------------------------------------------
  # 3-Node etcd Consensus Cluster (DCS)
  # -------------------------------------------------------------------------
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: hyperscale-etcd-1
    environment:
      ETCD_NAME: etcd-1
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-1:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-1:2380
      ETCD_INITIAL_CLUSTER_TOKEN: hyperscale-etcd-cluster
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_AUTO_COMPACTION_RETENTION: "1"
    volumes:
      - etcd-1-data:/etcd-data
    healthcheck:
      test: ["CMD-SHELL", "etcdctl endpoint health http://localhost:2379 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: hyperscale-etcd-2
    environment:
      ETCD_NAME: etcd-2
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-2:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-2:2380
      ETCD_INITIAL_CLUSTER_TOKEN: hyperscale-etcd-cluster
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_AUTO_COMPACTION_RETENTION: "1"
    volumes:
      - etcd-2-data:/etcd-data
    healthcheck:
      test: ["CMD-SHELL", "etcdctl endpoint health http://localhost:2379 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: hyperscale-etcd-3
    environment:
      ETCD_NAME: etcd-3
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-3:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_TOKEN: hyperscale-etcd-cluster
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_AUTO_COMPACTION_RETENTION: "1"
    volumes:
      - etcd-3-data:/etcd-data
    healthcheck:
      test: ["CMD-SHELL", "etcdctl endpoint health http://localhost:2379 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  # -------------------------------------------------------------------------
  # 3-Node Patroni / PostgreSQL 16 Streaming Replication Cluster
  # -------------------------------------------------------------------------
  postgres-1:
    build:
      context: ./performance/patroni
      dockerfile: Dockerfile
    image: hyperscale-patroni:16
    container_name: hyperscale-postgres-1
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    environment:
      NODE_NAME: postgres-1
      ETCD_HOSTS: etcd-1:2379,etcd-2:2379,etcd-3:2379
      POSTGRES_USER: ${POSTGRES_USER:-hyperscale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyperscale}
      POSTGRES_DB: ${POSTGRES_DB:-hyperscale}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-replicator_pass}
    ports:
      - "5432:5432"
      - "8008:8008"
    volumes:
      - postgres-1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres-2:
    build:
      context: ./performance/patroni
      dockerfile: Dockerfile
    image: hyperscale-patroni:16
    container_name: hyperscale-postgres-2
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    environment:
      NODE_NAME: postgres-2
      ETCD_HOSTS: etcd-1:2379,etcd-2:2379,etcd-3:2379
      POSTGRES_USER: ${POSTGRES_USER:-hyperscale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyperscale}
      POSTGRES_DB: ${POSTGRES_DB:-hyperscale}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-replicator_pass}
    ports:
      - "5433:5432"
      - "8009:8008"
    volumes:
      - postgres-2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres-3:
    build:
      context: ./performance/patroni
      dockerfile: Dockerfile
    image: hyperscale-patroni:16
    container_name: hyperscale-postgres-3
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    environment:
      NODE_NAME: postgres-3
      ETCD_HOSTS: etcd-1:2379,etcd-2:2379,etcd-3:2379
      POSTGRES_USER: ${POSTGRES_USER:-hyperscale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyperscale}
      POSTGRES_DB: ${POSTGRES_DB:-hyperscale}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-replicator_pass}
    ports:
      - "5434:5432"
      - "8010:8008"
    volumes:
      - postgres-3-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 12
      start_period: 10s

  # -------------------------------------------------------------------------
  # Multi-Host Primary-Aware Database Connectivity Overrides
  # -------------------------------------------------------------------------
  app-1:
    depends_on:
      postgres-1:
        condition: service_healthy
      postgres-2:
        condition: service_healthy
      postgres-3:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-1:5432,postgres-2:5432,postgres-3:5432/hyperscale?targetServerType=primary&connectTimeout=5&socketTimeout=30

  app-2:
    depends_on:
      postgres-1:
        condition: service_healthy
      postgres-2:
        condition: service_healthy
      postgres-3:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-1:5432,postgres-2:5432,postgres-3:5432/hyperscale?targetServerType=primary&connectTimeout=5&socketTimeout=30

  order-query-1:
    depends_on:
      postgres-1:
        condition: service_healthy
      postgres-2:
        condition: service_healthy
      postgres-3:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-1:5432,postgres-2:5432,postgres-3:5432/hyperscale?targetServerType=primary&connectTimeout=5&socketTimeout=30

  order-query-2:
    depends_on:
      postgres-1:
        condition: service_healthy
      postgres-2:
        condition: service_healthy
      postgres-3:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-1:5432,postgres-2:5432,postgres-3:5432/hyperscale?targetServerType=primary&connectTimeout=5&socketTimeout=30

volumes:
  etcd-1-data:
    name: hyperscale_etcd-1-data
  etcd-2-data:
    name: hyperscale_etcd-2-data
  etcd-3-data:
    name: hyperscale_etcd-3-data
  postgres-1-data:
    name: hyperscale_postgres-1-data
  postgres-2-data:
    name: hyperscale_postgres-2-data
  postgres-3-data:
    name: hyperscale_postgres-3-data
