global:
  namespace: hyperscale
  revision: development
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  storageClass: "standard"

# ---------------------------------------------------------------------------
# Ingress (HAProxy with Peer Stick-Table Synchronization)
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  replicaCount: 2
  rateLimit: 300000
  image:
    repository: haproxy
    tag: 2.9-alpine
  service:
    type: NodePort
    appPort: 8080
    appNodePort: 30080
    queryPort: 8081
    queryNodePort: 30081
    statsPort: 8404
    statsNodePort: 30404
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 1024Mi

# ---------------------------------------------------------------------------
# Stateless Application Deployments
# ---------------------------------------------------------------------------
app:
  enabled: true
  replicaCount: 5
  image:
    repository: hyperscale-commerce-app
    tag: 0.0.1-SNAPSHOT
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1024Mi
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75

orderQuery:
  enabled: true
  replicaCount: 5
  image:
    repository: hyperscale-commerce-order-query
    tag: 0.0.1-SNAPSHOT
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1024Mi
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75

# ---------------------------------------------------------------------------
# Stateful Quorums (Kafka, etcd, Patroni/PostgreSQL)
# ---------------------------------------------------------------------------
kafka:
  enabled: true
  replicaCount: 3
  image:
    repository: confluentinc/cp-kafka
    tag: 7.7.0
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: 2000m
      memory: 2048Mi

etcd:
  enabled: true
  replicaCount: 3
  image:
    repository: quay.io/coreos/etcd
    tag: v3.5.12
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

postgresHa:
  enabled: true
  replicaCount: 3
  image:
    repository: hyperscale-patroni
    tag: "16"
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  credentials:
    database: hyperscale
    username: hyperscale
    password: hyperscale
    replicatorPassword: replicator_pass

redis:
  enabled: true
  replicaCount: 1
  image:
    repository: redis
    tag: 7.2-alpine
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  auth:
    enabled: true
    password: "redis_secure_password"
  exporter:
    image:
      repository: oliver006/redis_exporter
      tag: v1.62.0
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# ---------------------------------------------------------------------------
# Security & Network Isolation
# ---------------------------------------------------------------------------
security:
  networkPolicy:
    enabled: true
  podSecurityStandards:
    enforce: "restricted"

# Isolated owner-approved local delivery profile; baseline remains unchanged.
localDelivery:
  enabled: false
  primaryPoolSize: 8
  replicaPoolSize: 4
  tracingEndpoint: http://otel-collector:9411/api/v2/spans
