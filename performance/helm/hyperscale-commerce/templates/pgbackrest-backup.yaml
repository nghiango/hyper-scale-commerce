apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgbackrest-repo-pvc
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: backup
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-daily
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *" # Daily at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hyperscale-commerce
            app.kubernetes.io/component: backup
        spec:
          serviceAccountName: hyperscale-service-account
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pgbackrest-backup
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              image: "{{ .Values.postgresHa.image.repository }}:{{ .Values.postgresHa.image.tag }}"
              command:
                - /bin/sh
                - -c
                - |
                  echo "=== Triggering scheduled PostgreSQL physical basebackup ==="
                  TIMESTAMP=$(date -u +"%Y%m%d_%H%M%SZ")
                  pg_basebackup -h postgres-ha-primary -U postgres -D - -Ft -z -X stream -c fast > /var/lib/pgbackrest/backup_${TIMESTAMP}.tar.gz
                  echo "Backup archived successfully: /var/lib/pgbackrest/backup_${TIMESTAMP}.tar.gz"
              env:
                - name: PGPASSWORD
                  value: {{ .Values.postgresHa.credentials.password | quote }}
              volumeMounts:
                - name: backup-repo
                  mountPath: /var/lib/pgbackrest
          volumes:
            - name: backup-repo
              persistentVolumeClaim:
                claimName: pgbackrest-repo-pvc
