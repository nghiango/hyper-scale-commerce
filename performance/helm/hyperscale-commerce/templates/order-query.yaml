{{- if .Values.orderQuery.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: order-query-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: order-query
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  selector:
    app.kubernetes.io/component: order-query
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-query-pdb
  namespace: {{ .Values.global.namespace }}
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: order-query
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-query
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: order-query
spec:
  replicas: {{ .Values.orderQuery.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: order-query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperscale-commerce
        app.kubernetes.io/component: order-query
    spec:
      serviceAccountName: hyperscale-service-account
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: order-query
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-query
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: "{{ .Values.orderQuery.image.repository }}:{{ .Values.orderQuery.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-ha-0.postgres-ha-headless.{{ .Values.global.namespace }}.svc.cluster.local:5432,postgres-ha-1.postgres-ha-headless.{{ .Values.global.namespace }}.svc.cluster.local:5432,postgres-ha-2.postgres-ha-headless.{{ .Values.global.namespace }}.svc.cluster.local:5432/hyperscale?targetServerType=primary"
            - name: SPRING_DATASOURCE_PRIMARY_URL
              value: "jdbc:postgresql://postgres-ha-0.postgres-ha-headless.{{ .Values.global.namespace }}.svc.cluster.local:5432,postgres-ha-1.postgres-ha-headless.{{ .Values.global.namespace }}.svc.cluster.local:5432,postgres-ha-2.postgres-ha-headless.{{ .Values.global.namespace }}.svc.cluster.local:5432/hyperscale?targetServerType=primary"
            - name: SPRING_DATASOURCE_REPLICA_URL
              value: "jdbc:postgresql://postgres-ha-0.postgres-ha-headless.{{ .Values.global.namespace }}.svc.cluster.local:5432,postgres-ha-1.postgres-ha-headless.{{ .Values.global.namespace }}.svc.cluster.local:5432,postgres-ha-2.postgres-ha-headless.{{ .Values.global.namespace }}.svc.cluster.local:5432/hyperscale?targetServerType=secondary&loadBalanceHosts=true"
            - name: POSTGRES_USER
              value: {{ .Values.postgresHa.credentials.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresHa.credentials.password | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-headless.{{ .Values.global.namespace }}.svc.cluster.local:9092"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis.{{ .Values.global.namespace }}.svc.cluster.local"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-password
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_CONFIG_NAME
              value: "orderquery"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.orderQuery.resources | nindent 12 }}
{{- end }}
