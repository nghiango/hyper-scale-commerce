global
    log stdout format raw local0 info
    maxconn 10000

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    retries 3

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s

frontend app_front
    bind *:8080

    # Stick table tracking request rate per client IP (1 minute window)
    stick-table type ip size 100k expire 1m store http_req_rate(1m)
    http-request track-sc0 src

    # Overwrite untrusted forwarding headers
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Port 8080

    # Security: block administrative routes on public port
    acl is_admin_route path_beg /admin/
    http-request deny deny_status 403 if is_admin_route

    # Security: block sensitive actuator routes
    acl is_sensitive_actuator path_beg /actuator/env /actuator/beans /actuator/heapdump /actuator/configprops
    http-request deny deny_status 404 if is_sensitive_actuator

    # Enforce topology-wide client rate limit (500 req/min)
    acl is_rate_limited sc0_http_req_rate gt 500
    http-request return status 429 content-type application/json hdr "Retry-After" "60" string '{"error":"Too Many Requests","message":"Rate limit exceeded. Please retry later."}' if is_rate_limited

    default_backend app_back

backend app_back
    balance roundrobin
    option httpchk GET /actuator/health/readiness
    http-check expect status 200
    default-server check inter 2s fall 2 rise 2
    server app-1 app-1:8080 check
    server app-2 app-2:8080 check

frontend order_query_front
    bind *:8081

    # Stick table tracking request rate per client IP (1 minute window)
    stick-table type ip size 100k expire 1m store http_req_rate(1m)
    http-request track-sc0 src

    # Overwrite untrusted forwarding headers
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Port 8081

    # Security: block DLQ replay and admin routes on public port
    acl is_dlq_admin path_beg /admin/dlq /orders/admin/dlq
    http-request deny deny_status 403 if is_dlq_admin

    # Security: block sensitive actuator routes
    acl is_sensitive_actuator path_beg /actuator/env /actuator/beans /actuator/heapdump /actuator/configprops
    http-request deny deny_status 404 if is_sensitive_actuator

    # Enforce topology-wide client rate limit (500 req/min)
    acl is_query_rate_limited sc0_http_req_rate gt 500
    http-request return status 429 content-type application/json hdr "Retry-After" "60" string '{"error":"Too Many Requests","message":"Rate limit exceeded. Please retry later."}' if is_query_rate_limited

    default_backend order_query_back

backend order_query_back
    balance roundrobin
    option httpchk GET /actuator/health/readiness
    http-check expect status 200
    default-server check inter 2s fall 2 rise 2
    server order-query-1 order-query-1:8081 check
    server order-query-2 order-query-2:8081 check
